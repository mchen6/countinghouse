name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# A new push to a pull request cancels that PR's superseded run (the group is
# the PR number); a push to master is grouped by its sha, unique per commit,
# so no master run is ever cancelled and every merged commit keeps its result.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  # The one invariant that must never break: no commit may move the MCP
  # surface. api.json is a description format and the module shape is an
  # authoring concern, so neither is allowed to change what a client sees.
  #
  # Its own job, ahead of everything else, because it takes ~10s where the
  # functional suite takes ~25min -- a moved tool surface should be the first
  # thing a run reports, not something found 20 minutes in. `needs:` on the
  # test job makes this a gate rather than a parallel opinion.
  golden:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the per-commit walk below needs history

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Golden tools/list sample (tip)
        run: npm run golden

      # "every commit", not just the tip. A push can contain a commit that
      # moved the surface and a later one that moved it back; the tip check
      # cannot see that, and a bisect later would land in a broken window.
      #
      # Bounded deliberately: pushes larger than MAX are checked at the tip
      # only, so an initial import or a long-lived branch merge does not turn
      # one push into an hour of CI. node_modules is untracked, so it survives
      # each checkout and is installed once -- except for commits whose own
      # dependencies differ from the tip's, which get their own install (see
      # the loop).
      - name: Golden tools/list sample (every commit in this push)
        if: github.event_name == 'push'
        env:
          MAX: 25
        run: |
          BEFORE='${{ github.event.before }}'
          case "$BEFORE" in
            ''|0000000000000000000000000000000000000000)
              echo "no usable base ref (new branch or force-push) -- tip already checked"
              exit 0 ;;
          esac

          COMMITS=$(git rev-list --reverse "$BEFORE..${{ github.sha }}" || true)
          [ -z "$COMMITS" ] && { echo "no commits to walk"; exit 0; }

          N=$(echo "$COMMITS" | wc -l)
          if [ "$N" -gt "$MAX" ]; then
            echo "$N commits in this push, over the $MAX cap -- tip already checked, skipping the walk"
            exit 0
          fi

          echo "walking $N commit(s)"
          FAILED=""
          TIP='${{ github.sha }}'

          # node_modules currently holds the tip's dependencies. Reusing it
          # across the walk is a large speed win and is correct for the usual
          # push, where no commit touches dependencies. It is NOT correct for
          # a commit whose dependency set differs from the tip's: that
          # commit's code then runs against the wrong node_modules and can
          # fail to load outright, which this check would report as a moved
          # tool surface. That is what happened on the 7.0.0 push that removed
          # the `oauth` dependency -- the commit before the removal still
          # required that package, could not boot, and was reported as MOVED
          # when its surface was in fact byte-identical.
          #
          # So: give such a commit its own install, and put the tip's
          # dependencies back before the next commit that expects them.
          # -f on checkout because npm rewrites package-lock.json, which would
          # otherwise block the next checkout.
          DEPS_ARE_TIP=1
          for SHA in $COMMITS; do
            git checkout -q -f "$SHA"

            # Invoke mocha directly rather than `npm run golden`: the script
            # only exists from the commit that added it, so using it would
            # report every older commit as a failure with an empty log. A
            # check that cries wolf on history is worse than no check.
            if [ ! -d test/mcp-contract ]; then
              echo "  skip    $(git log -1 --format='%h %s' "$SHA")  (predates the golden sample)"
              continue
            fi

            if git diff --quiet "$TIP" "$SHA" -- package.json package-lock.json; then
              if [ "$DEPS_ARE_TIP" != "1" ]; then
                echo "  deps    restoring the tip's dependencies"
                git checkout -q -f "$TIP" -- package.json package-lock.json
                npm install --legacy-peer-deps > /tmp/npm-restore.log 2>&1 \
                  || { echo "  ERROR   could not restore the tip's dependencies"; tail -25 /tmp/npm-restore.log; exit 1; }
                git checkout -q -f "$SHA"
                DEPS_ARE_TIP=1
              fi
            else
              echo "  deps    $(git log -1 --format='%h' "$SHA") declares different dependencies -- installing its own"
              npm install --legacy-peer-deps > /tmp/npm-$SHA.log 2>&1 \
                || { echo "  ERROR   npm install failed at this commit"; tail -25 /tmp/npm-$SHA.log; exit 1; }
              DEPS_ARE_TIP=0
            fi

            if npx mocha ./test/mcp-contract/*.js > /tmp/golden-$SHA.log 2>&1; then
              echo "  ok      $(git log -1 --format='%h %s' "$SHA")"
            else
              # A server that never started is a broken commit, but it is not
              # a moved tool surface, and saying it moved sends the next
              # reader hunting for a change that never happened.
              if grep -q 'ECONNREFUSED' /tmp/golden-$SHA.log; then
                echo "  NOBOOT  $(git log -1 --format='%h %s' "$SHA")  -- server did not start; not a surface change"
              else
                echo "  MOVED   $(git log -1 --format='%h %s' "$SHA")"
              fi
              tail -25 /tmp/golden-$SHA.log
              FAILED="$FAILED $SHA"
            fi
          done

          git checkout -q -f "$TIP"
          if [ "$DEPS_ARE_TIP" != "1" ]; then
            npm install --legacy-peer-deps > /tmp/npm-restore.log 2>&1 || true
          fi
          if [ -n "$FAILED" ]; then
            echo "the golden check failed at:$FAILED"
            exit 1
          fi

  test:
    needs: golden
    runs-on: ubuntu-latest
    # A hung run frees its runner after an hour (normal runs take about 20
    # minutes); without this, GitHub's default holds it for six.
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        # The floor itself (lib/node-version.js, 22.16.0), 24.15.0 (the first
        # where Node's own resolve hook covers require.resolve), the newest
        # 24.x and the newest 26.x. The sandbox-floor job below adds the
        # versions on either side.
        node-version: ['22.16.0', '24.15.0', '24', '26']

    services:
      redis:
        image: redis
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # Holds the 6.0.0 ES6 conversion in place: no-var, prefer-const,
      # prefer-arrow-callback, prefer-template, no-prototype-builtins.
      # Runs before the tests because it is seconds, not minutes, and a
      # style regression should not wait on a full suite to surface.
      - name: Lint
        run: npm run lint

      # test7 is a multi-thread performance benchmark, not a correctness
      # check - it takes several minutes and isn't meant to gate CI, so
      # this deliberately excludes it (mirrors the local dev-loop workflow)
      - name: Run functional tests
        run: |
          npx mocha ./test/test1.js
          npx mocha ./test/test2.js
          npx mocha ./test/test3.js
          npx mocha ./test/test4.js
          npx mocha --exit ./test/test5.js
          npx mocha ./test/auth/*.js ./test/fs-broker/*.js ./test/device-config/*.js ./test/module-loading/*.js ./test/spec-format/*.js ./test/mcp-contract/*.js ./test/validation/*.js ./test/module-authoring/*.js ./test/store/*.js ./test/metering/*.js ./test/local-kv/*.js ./test/jobs-local/*.js
          npx mocha --exit ./test/composition/*.js
          npx mocha --exit ./test/roles/*.js
          npx mocha --exit ./test/usage/*.js
          npx mocha --exit ./test/remote/*.js
          npx mocha --exit ./test/sandbox/*.js
          npx mocha --exit ./test/single-thread/*.js
          npx mocha ./test/test8.js
          npm run test:peer-standalone
          npx mocha ./test/test6.js

      # informational only for now - the dependency tree isn't at zero
      # vulnerabilities yet, so this doesn't gate CI; it's here so the
      # count is visible in every run while that work continues
      - name: npm audit (informational)
        run: npm audit || true

  # The versions between the floor (22.16.0, in the test matrix above) and
  # 24.15, where Node's own resolve hook starts covering require.resolve:
  # below it the resolve shim (lib/resolve-shim.js) does, and the sandbox,
  # file broker and single-thread tests must hold the same on each
  # (docs/superpowers/specs/2026-11-11-node-floor-shim-design.md, section 4).
  sandbox-floor:
    needs: golden
    runs-on: ubuntu-latest
    # A hung run frees its runner after an hour (normal runs take about 20
    # minutes); without this, GitHub's default holds it for six.
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24.0.0', '24.14']

    services:
      redis:
        image: redis
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Sandbox, file broker and single-thread tests
        run: |
          npx mocha --exit ./test/sandbox/*.js
          npx mocha ./test/fs-broker/*.js
          npx mocha --exit ./test/single-thread/*.js

  # --stdio, the client-pack transport (local-mode spec §2), on the three
  # systems a client runs on, with no Redis service at all: the route layer
  # over in-memory streams, then countinghouse-stdio spawned with one module.
  # Windows does not gate yet: the runtime never brings a module online there
  # (issue #40), which LM1 part C's last step catalogues and works on.
  stdio:
    runs-on: ${{ matrix.os }}
    # A hung run frees its runner after an hour (normal runs take about 20
    # minutes); without this, GitHub's default holds it for six.
    timeout-minutes: 60
    continue-on-error: ${{ matrix.os == 'windows-latest' }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: stdio tests
        run: npx mocha --exit test/stdio/*.js

  # --store local with no Redis service (LM1, the local-mode spec's CI line):
  # the local store's own tests and a server smoke test (test/store/05: a
  # preloaded trap fails the run if anything makes a Redis client or loads a
  # queue library) on each OS a client machine runs. Windows is reported
  # but does not gate yet: the module sandbox's Windows gaps are being
  # catalogued separately (issue #40), and the smoke test's flush-on-SIGTERM
  # check does not apply there (a Windows process cannot be sent one).
  local-store:
    name: local store (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A hung run frees its runner after an hour (normal runs take about 20
    # minutes); without this, GitHub's default holds it for six.
    timeout-minutes: 60
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Local store tests and smoke test, no Redis
        run: npx mocha --exit ./test/store/04-json-file.js ./test/metering/02-local-provider.js ./test/metering/03-seed-cli.js ./test/local-kv/00-allowed.js ./test/local-kv/01-semantics.js ./test/jobs-local/01-runner.js ./test/store/05-local-smoke.js
