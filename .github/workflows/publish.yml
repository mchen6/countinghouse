name: publish

# Publishes the countinghouse package to npm under trusted publishing (OIDC):
# the repository holds no npm token and nobody types a 2FA code. GitHub hands
# the job a short-lived identity token, npm checks it against the trusted
# publisher configured on the package (owner mchen6, repository countinghouse,
# workflow file publish.yml) and attaches provenance to the version. The
# one-time configuration, which only the maintainer can do, is in
# docs/publishing.md.
#
# Runs when a tag v<version> is pushed to a commit on master whose
# package.json carries exactly that version. The tag is cut from a master
# commit CI has already run on; this job does not repeat the 40-minute suite.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write   # the OIDC token npm trusts; the only credential involved

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: The commit is on master
        run: |
          git fetch origin master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master || { echo "::error::$GITHUB_SHA is not on master"; exit 1; }

      - name: The tag names package.json's version
        run: |
          version="$(node -p "require('./package.json').version")"
          [ "${GITHUB_REF_NAME}" = "v${version}" ] || { echo "::error::tag ${GITHUB_REF_NAME} but package.json says ${version}"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: npm supports trusted publishing (11.5.1 or later)
        run: |
          node -e "
            const [a, b, c] = require('child_process').execSync('npm --version').toString().trim().split('.').map(Number);
            const ok = a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1)));
            if (!ok) { console.error('npm ' + [a, b, c].join('.') + ' is older than 11.5.1'); process.exit(1); }
            console.log('npm ' + [a, b, c].join('.'));
          "

      - name: What the tarball holds
        run: npm pack --dry-run

      - name: Publish
        run: npm publish --access public
